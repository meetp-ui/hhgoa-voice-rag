[project]
name = "voice-rag-backend"
version = "0.1.0"
description = "Voice-enabled RAG backend (Flask + LangGraph-equivalent pipeline harness)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask[async]>=3.0.3",
    "flask-cors>=4.0.1",
    "gunicorn>=22.0.0",
    "uvicorn[standard]>=0.30.0",
    "asgiref>=3.8.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "flask-pydantic>=0.12.0",
    "qdrant-client==1.10.1",
    "httpx>=0.27.0",
    "duckdb>=1.0.0",
    "pyarrow>=16.0.0",
    "tokenizers>=0.19.0",
    "fastembed>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
